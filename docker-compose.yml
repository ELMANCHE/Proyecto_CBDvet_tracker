version: "3.9"

services:
  web:
    build: .
    command: flask run --host=0.0.0.0 --port=5000
    container_name: cbdvet_web
    ports:
      - "5001:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_SECRET=${FLASK_SECRET:-change-me}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://cbdvet_user:cbdvet_pass@db:5432/cbdvet_db}
    depends_on:
      - db
    volumes:
      - .:/app:ro

  streamlit:
    build: .
    command: streamlit run analizador_cbd_ml.py --server.address=0.0.0.0 --server.port=8501
    container_name: cbdvet_streamlit
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://cbdvet_user:cbdvet_pass@db:5432/cbdvet_db}
    depends_on:
      - db
    volumes:
      - .:/app:ro

  db:
    image: postgres:15
    container_name: cbdvet_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cbdvet_db}
      - POSTGRES_USER=${POSTGRES_USER:-cbdvet_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cbdvet_pass}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
